include_patterns:
  - "**/*.kt"
  - "**/*.java"
  - "**/*.xml"
  - "**/*.gradle"
  - "**/*.kts"
  - "**/*.md"
  - "**/*.json"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/*.properties"
exclude_patterns:
  - "**/.*"
  - "**/__pycache__"
  - "**/node_modules"
  - "**/target"
  - "**/build"
  - "**/dist"
  - "**/.cocoindex_code"
  - "**/.gradle"
  - "**/.idea"
